# Rebuilds and redeploys the site on a timer so newly hard-flagged links get their own crawlable
# result page. The build reads the proxy's index feed to know which pages to generate; if the feed
# is unreachable or the secrets are unset, it degrades to zero generated pages and still deploys.
name: Publish scan pages

on:
  schedule:
    # Every 30 minutes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Let a manual or scheduled run replace an in-progress one, but never cancel a normal site deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SCAN_FEED_URL: ${{ secrets.SCAN_FEED_URL }}
          SCAN_FEED_TOKEN: ${{ secrets.SCAN_FEED_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # Testing: disable the 24h dwell gate. Remove this line for normal operation.
          SCAN_DWELL_HOURS: '0'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
