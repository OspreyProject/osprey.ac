# Builds and deploys the site on every push to main and on a 30 minute timer. The timer exists so
# newly hard-flagged links get their own crawlable result page between pushes. The build reads the
# proxy's index feed to know which pages to generate; if the feed is unreachable or the secrets are
# unset, it degrades to zero generated pages and still deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Queue runs behind each other rather than cancelling, so a scheduled run never kills a push deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SCAN_FEED_URL: ${{ secrets.SCAN_FEED_URL }}
          SCAN_FEED_TOKEN: ${{ secrets.SCAN_FEED_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Show sitemap
        run: cat dist/sitemap-0.xml

      - name: Commit IndexNow cache
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain .astro-indexnow-cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .astro-indexnow-cache.json
            git commit -m "chore: update IndexNow cache [skip ci]"
            git push
          else
            echo "No cache changes to commit."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
